<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CV · José Luis Fernández</title>
  <meta name="description" content="Currículum de José Luis Fernández Solís, Java Backend Developer. Versión texto y versión interactiva 3D." />
  <meta name="theme-color" content="#0b0f17" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/cv.css" />
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body class="cv-page">
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="cv-bar">
    <div class="container cv-bar__inner">
      <a href="index.html" class="cv-back"><span aria-hidden="true">←</span> <span data-cvui="back">Portfolio</span></a>

      <div class="mode" role="tablist" aria-label="Modo de visualización">
        <button role="tab" class="mode__btn is-active" id="mode-text" aria-selected="true" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>
          <span data-cvui="text">Texto</span>
        </button>
        <button role="tab" class="mode__btn" id="mode-game" aria-selected="false" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3M15.5 12h.01M18 13.5h.01"/></svg>
          <span data-cvui="game">Interactivo 3D</span>
        </button>
      </div>

      <div class="nav__actions">
        <button class="icon-btn" id="print" type="button" aria-label="Imprimir">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="7"/></svg>
        </button>
        <button class="icon-btn" id="lang-toggle" type="button" aria-label="Cambiar idioma / Change language"><span class="lang-label">EN</span></button>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Cambiar tema">
          <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container cv-main">
    <article class="cv-doc" id="cv-doc" aria-live="polite"></article>
  </main>

  <section class="game-view" id="game-view" hidden aria-label="CV interactivo 3D">
    <div class="game-loading" id="game-loading"><span class="spinner"></span><span data-cvui="loading">Cargando mundo 3D…</span></div>
    <div class="game-root" id="game-root"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/cv-data.js"></script>
  <script type="module" src="js/cv.js"></script>
</body>
</html>
